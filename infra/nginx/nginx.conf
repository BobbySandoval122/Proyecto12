user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format orvia '$remote_addr - $request_id [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_user_agent" '
                     'upstream=$upstream_addr tiempo=$request_time';
    access_log /var/log/nginx/access.log orvia;
    error_log /var/log/nginx/error.log warn;

    map $http_x_correlation_id $correlation_id {
        "~^[A-Za-z0-9._-]{1,64}$" $http_x_correlation_id;
        default                    $request_id;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;

    # Docker puede asignar otra IP al recrear un contenedor. Los upstreams con
    # `resolve` consultan periodicamente el DNS embebido y evitan reiniciar
    # manualmente Nginx o enviar trafico a la IP anterior.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream app_backend { zone app_backend 64k; server app:8000 resolve; }
    upstream auth_backend { zone auth_backend 64k; server auth:8000 resolve; }
    upstream devoluciones_backend { zone devoluciones_backend 64k; server devoluciones:8000 resolve; }
    upstream logistica_backend { zone logistica_backend 64k; server logistica:8000 resolve; }
    upstream inspecciones_backend { zone inspecciones_backend 64k; server inspecciones:8000 resolve; }
    upstream disposicion_backend { zone disposicion_backend 64k; server disposicion-inventario:8000 resolve; }
    upstream reembolsos_backend { zone reembolsos_backend 64k; server reembolsos-costos:8000 resolve; }
    upstream ventas_backend { zone ventas_backend 64k; server ventas-catalogos:8000 resolve; }
    upstream evidencias_backend { zone evidencias_backend 64k; server evidencias:8000 resolve; }
    upstream auditoria_backend { zone auditoria_backend 64k; server analisis-auditoria:8000 resolve; }
    upstream reportes_backend { zone reportes_backend 64k; server reportes-analitica:8000 resolve; }
    upstream causa_raiz_backend { zone causa_raiz_backend 64k; server causa-raiz:8000 resolve; }
    upstream sincronizacion_backend { zone sincronizacion_backend 64k; server sincronizacion:8000 resolve; }
    upstream proveedores_backend { zone proveedores_backend 64k; server proveedores:8000 resolve; }
    upstream integraciones_backend { zone integraciones_backend 64k; server integraciones-monitoreo:8000 resolve; }
    upstream motivos_backend { zone motivos_backend 64k; server clasificacion-motivos:8000 resolve; }

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 30m;

    include /etc/nginx/conf.d/*.conf;
}
