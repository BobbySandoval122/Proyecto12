openapi: 3.0.3
info:
  title: Servicio de integraciones y monitoreo
  version: 1.0.0
  description: >-
    Dominios 21 y 22 del tercer parcial. Integraciones con POS, ERP, WMS,
    transportistas y sistemas financieros (JSON/XML con XSD, importacion,
    exportacion y conciliacion de identificadores) y monitoreo de la plataforma
    (salud, bases, colas, tiempos de respuesta, alertas y traza distribuida).
servers: [{url: /}]
security: [{bearerAuth: []}]
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  schemas:
    VentaPos:
      type: object
      required: [id_externo, tienda_externa, cliente_email, fecha_venta, lineas]
      properties:
        id_externo: {type: string, description: Ticket del POS}
        tienda_externa: {type: string, description: Codigo de tienda en el POS (debe estar conciliado)}
        cliente_email: {type: string}
        fecha_venta: {type: string, format: date}
        lineas:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: object, required: [sku, numero_lote, cantidad, precio_unitario], properties: {sku: {type: string}, numero_lote: {type: string}, cantidad: {type: integer, minimum: 1}, precio_unitario: {type: number, minimum: 0}}}
    Conciliacion:
      type: object
      required: [sistema, tipo_entidad, id_externo, id_interno]
      properties:
        sistema: {type: string, enum: [pos, erp, wms, transportista, financiero]}
        tipo_entidad: {type: string, enum: [tienda, venta, producto, devolucion, recoleccion]}
        id_externo: {type: string}
        id_interno: {type: integer, minimum: 1}
    EventoTransportista:
      type: object
      required: [guia, estado]
      properties:
        guia: {type: string, description: Guia del transportista conciliada como recoleccion}
        estado: {type: string, enum: [en_transito, completada, fallida]}
        fecha: {type: string, format: date-time}
paths:
  /api/v1/integraciones/ventas:
    post:
      summary: Importar una venta del POS (Administrador)
      description: Idempotente por id_externo. 201 si se creo; 200 con repetida=true si ya existia.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VentaPos'}}, application/xml: {schema: {$ref: '#/components/schemas/VentaPos'}}}}
      responses: {'201': {description: Importada}, '200': {description: Ya importada antes}, '400': {description: Datos invalidos o XML fuera del XSD}, '403': {description: Rol incorrecto}, '409': {description: Folio ocupado}, '422': {description: 'sin_conciliar, cliente_desconocido o lote_desconocido'}}
  /api/v1/integraciones/conciliaciones:
    post:
      summary: Registrar equivalencia de identificadores (Administrador)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Conciliacion'}}, application/xml: {schema: {$ref: '#/components/schemas/Conciliacion'}}}}
      responses: {'201': {description: Registrada}, '200': {description: Ya existia igual}, '404': {description: El registro interno no existe}, '409': {description: El id ya apunta a otro registro}}
    get:
      summary: Listar conciliaciones (Administrador)
      parameters: [{name: sistema, in: query, schema: {type: string}}, {name: tipo_entidad, in: query, schema: {type: string}}, {name: pagina, in: query, schema: {type: integer}}, {name: por_pagina, in: query, schema: {type: integer}}]
      responses: {'200': {description: Lista paginada}}
  /api/v1/integraciones/conciliaciones/{sistema}/{tipo_entidad}/{id_externo}:
    get:
      summary: Traducir un id externo al interno
      parameters: [{name: sistema, in: path, required: true, schema: {type: string}}, {name: tipo_entidad, in: path, required: true, schema: {type: string}}, {name: id_externo, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Equivalencia}, '422': {description: Sin conciliar}}
  /api/v1/integraciones/exportaciones/devoluciones:
    get:
      summary: Exportar devoluciones para ERP y sistemas financieros
      description: Roles Administrador, Encargado de Reembolsos y Analista. JSON o XML segun Accept. Incluye reembolso, costo total y los ids del POS y del ERP.
      parameters: [{name: desde, in: query, schema: {type: string, format: date}}, {name: hasta, in: query, schema: {type: string, format: date}}, {name: pagina, in: query, schema: {type: integer}}, {name: por_pagina, in: query, schema: {type: integer}}]
      responses: {'200': {description: Lista paginada}, '400': {description: Rango invalido}}
  /api/v1/integraciones/transportistas/eventos:
    post:
      summary: Avance de una recoleccion reportado por el transportista
      description: Roles Administrador y Coordinador. Reenviar el mismo evento responde cambio=false.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EventoTransportista'}}, application/xml: {schema: {$ref: '#/components/schemas/EventoTransportista'}}}}
      responses: {'200': {description: Aplicado o sin cambios}, '409': {description: Transicion invalida}, '422': {description: Guia sin conciliar}}
  /api/v1/monitoreo/estado:
    get:
      summary: Chequeo en este momento (Administrador, Supervisor)
      description: Salud y tiempo de respuesta de cada servicio, PostgreSQL, Redis, MongoDB y la cola de sincronizacion; abre y resuelve alertas.
      responses: {'200': {description: Chequeo}}
  /api/v1/monitoreo/disponibilidad:
    get:
      summary: Disponibilidad, tiempo promedio, p95 y fallas por servicio
      parameters: [{name: horas, in: query, schema: {type: integer, minimum: 1, maximum: 168}}]
      responses: {'200': {description: Resumen}}
  /api/v1/monitoreo/alertas:
    get:
      summary: Alertas operativas
      parameters: [{name: estado, in: query, schema: {type: string, enum: [activa, resuelta]}}, {name: pagina, in: query, schema: {type: integer}}]
      responses: {'200': {description: Lista paginada}}
  /api/v1/monitoreo/traza/{correlation_id}:
    get:
      summary: Traza distribuida de una operacion
      description: Bitacora y eventos de todos los servicios con el mismo X-Correlation-ID, en orden.
      parameters: [{name: correlation_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Pasos}, '404': {description: Sin registros}}
  /health: {get: {security: [], summary: Salud de PostgreSQL, Redis y MongoDB, responses: {'200': {description: OK}, '503': {description: Degradado}}}}
