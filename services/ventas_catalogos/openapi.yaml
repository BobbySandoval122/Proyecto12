openapi: 3.0.3
info:
  title: Servicio de ventas y catalogos - Plataforma de devoluciones
  version: 1.0.0
  description: Consulta de ventas y lineas con cantidad disponible, y administracion de los siete catalogos. JSON/XML, JWT y PostgreSQL. RF-05, RF-06.
servers:
- url: /
paths:
  /health:
    get:
      summary: Estado del servicio
      responses:
        '200':
          description: Estado del servicio
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400': &id001
          description: Parámetros inválidos
        '401': &id002
          description: Token inválido
        '403': &id003
          description: Sin permisos
        '404': &id004
          description: No encontrado
        '409': &id005
          description: Conflicto de negocio
        '415': &id006
          description: Formato no permitido
        '500': &id007
          description: Error interno
        '503': &id008
          description: Dependencia no disponible
  /api/v1/ventas:
    get:
      summary: Listar ventas, solo las propias para cliente
      responses:
        '200':
          description: Listar ventas, solo las propias para cliente
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '415': *id006
        '500': *id007
        '503': *id008
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
      - name: por_pagina
        in: query
        required: false
        schema:
          type: integer
      security:
      - bearerAuth: []
  /api/v1/ventas/{id}:
    get:
      summary: Consulta una venta y las líneas con cantidad disponible
      responses:
        '200':
          description: Consulta una venta y las líneas con cantidad disponible
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '415': *id006
        '500': *id007
        '503': *id008
      parameters:
      - &id010
        name: id
        in: path
        required: true
        schema:
          type: integer
      security:
      - bearerAuth: []
  /api/v1/catalogos:
    get:
      summary: Tipos de catálogos disponibles
      responses:
        '200':
          description: Tipos de catálogos disponibles
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '415': *id006
        '500': *id007
        '503': *id008
      security:
      - bearerAuth: []
  /api/v1/catalogos/{nombre}:
    get:
      summary: Listar registros (el cliente solo ve motivos activos)
      responses:
        '200':
          description: Listar registros (el cliente solo ve motivos activos)
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '415': *id006
        '500': *id007
        '503': *id008
      parameters:
      - &id009
        name: nombre
        in: path
        required: true
        schema:
          type: string
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
      - name: por_pagina
        in: query
        required: false
        schema:
          type: integer
      security:
      - bearerAuth: []
    post:
      summary: Crear catálogo; administrador
      responses:
        '201':
          description: Crear catálogo; administrador
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '415': *id006
        '500': *id007
        '503': *id008
      requestBody:
        required: true
        content: &id011
          application/json:
            schema:
              type: object
          application/xml:
            schema:
              type: object
              xml:
                name: registro
      parameters:
      - *id009
      security:
      - bearerAuth: []
  /api/v1/catalogos/{nombre}/{id}:
    get:
      summary: Detalle de un registro
      responses:
        '200':
          description: Detalle de un registro
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '415': *id006
        '500': *id007
        '503': *id008
      parameters:
      - *id009
      - *id010
      security:
      - bearerAuth: []
    put:
      summary: Reemplazar campos permitidos del registro; administrador
      responses:
        '200':
          description: Reemplazar campos permitidos del registro; administrador
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '415': *id006
        '500': *id007
        '503': *id008
      requestBody:
        required: true
        content: *id011
      parameters:
      - *id009
      - *id010
      security:
      - bearerAuth: []
    delete:
      summary: Desactivar sin borrar historia
      responses:
        '200':
          description: Desactivar sin borrar historia
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '415': *id006
        '500': *id007
        '503': *id008
      parameters:
      - *id009
      - *id010
      security:
      - bearerAuth: []
  /api/v1/catalogos/{nombre}/{id}/estado:
    patch:
      summary: Establecer estado booleano activo
      responses:
        '200':
          description: Establecer estado booleano activo
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '415': *id006
        '500': *id007
        '503': *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                activo:
                  type: boolean
          application/xml:
            schema:
              type: object
              xml:
                name: estado
      parameters:
      - *id009
      - *id010
      security:
      - bearerAuth: []
  /api/v1/trazabilidad/lotes:
    get:
      summary: Lotes con unidades vendidas, devueltas y tasa (lotes con problemas recurrentes)
      description: Roles internos (no Cliente ni Recolector). Parametros q, proveedor_id, producto_id, solo_con_devoluciones, limite, desplazamiento.
      responses:
        '200': {description: Pagina de lotes}
        '401': {description: Sin token}
        '403': {description: Rol sin permiso}
      security:
      - bearerAuth: []
  /api/v1/trazabilidad/lotes/{lote_id}:
    get:
      summary: Trazabilidad de un lote
      description: Producto, proveedor, resumen con tasa, tiendas, series y cada devolucion con su recorrido (ruta, transportista, recepcion, inspeccion, disposicion). Es informacion para revision humana, no confirma causalidad (RN-09).
      parameters:
      - {name: lote_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Trazabilidad del lote}
        '401': {description: Sin token}
        '403': {description: Rol sin permiso}
        '404': {description: Lote inexistente}
      security:
      - bearerAuth: []
  /api/v1/trazabilidad/lotes/{lote_id}/series:
    post:
      summary: Alta de numeros de serie de un lote (solo Administrador, idempotente)
      parameters:
      - {name: lote_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                series: {type: array, maxItems: 500, items: {type: string, pattern: '^[A-Za-z0-9._-]{1,60}$'}}
          application/xml:
            schema: {type: object, xml: {name: lote_series}}
      responses:
        '201': {description: Series registradas}
        '400': {description: Series invalidas o repetidas}
        '403': {description: Solo Administrador}
        '404': {description: Lote inexistente}
        '409': {description: Serie que ya pertenece a otro lote}
      security:
      - bearerAuth: []
  /api/v1/trazabilidad/series/{numero_serie}:
    get:
      summary: Trazabilidad de una unidad por numero de serie
      parameters:
      - {name: numero_serie, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Serie con lote, proveedor, venta, tienda y recorrido de sus devoluciones}
        '404': {description: Serie inexistente}
      security:
      - bearerAuth: []
  /api/v1/trazabilidad/series/{numero_serie}/venta:
    patch:
      summary: Liga una serie a la linea de venta donde salio (Administrador u Operador de Almacen)
      parameters:
      - {name: numero_serie, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                venta_detalle_id: {type: integer}
          application/xml:
            schema: {type: object, xml: {name: serie_venta}}
      responses:
        '200': {description: Serie ligada}
        '404': {description: Serie o linea inexistente}
        '409': {description: Serie ya vendida, lote distinto o linea sin unidades libres}
      security:
      - bearerAuth: []
  /api/v1/trazabilidad/tasas:
    get:
      summary: Tasa de devolucion por proveedor, tienda, producto, lote o ruta
      description: "Tasa = unidades devueltas / unidades vendidas. En ruta se mide el dano: inspecciones no aptas / inspecciones realizadas. Parametros por, desde, hasta (AAAA-MM-DD). Incluye tasa_promedio_pct y veces_promedio."
      parameters:
      - {name: por, in: query, schema: {type: string, enum: [proveedor, tienda, producto, lote, ruta], default: proveedor}}
      - {name: desde, in: query, schema: {type: string, format: date}}
      - {name: hasta, in: query, schema: {type: string, format: date}}
      responses:
        '200': {description: Tasas ordenadas de mayor a menor}
        '400': {description: Dimension o fecha invalida}
        '403': {description: Rol sin permiso}
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

